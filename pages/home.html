<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>记录</title>
    <style id="theme-vars">
:root {
  --bg: #faf9f7;
  --surface: #ffffff;
  --surface-2: #f5f4f1;
  --ink: #1f1f1f;
  --ink-2: #6b6b6b;
  --ink-3: #a3a3a3;
  --line: #e8e6e1;
  --brand: #c17f59;
  --brand-ink: #ffffff;
  --brand-soft: #f7ede6;
  --state-success: #5c8d6d;
  --state-error: #c45b5b;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-pill: 999px;
  --shadow-1: 0 1px 2px rgba(31, 31, 31, 0.05), 0 1px 1px rgba(31, 31, 31, 0.03);
  --shadow-2: 0 8px 24px -8px rgba(31, 31, 31, 0.12);

  /* Semantic aliases for head contract */
  --life-background: var(--bg);
  --life-foreground: var(--ink);
  --life-card: var(--surface);
  --life-card-foreground: var(--ink);
  --life-popover: var(--surface);
  --life-popover-foreground: var(--ink);
  --life-primary: var(--brand);
  --life-primary-foreground: var(--brand-ink);
  --life-muted: var(--surface-2);
  --life-muted-foreground: var(--ink-2);
  --life-border: var(--line);
  --life-input: var(--line);
  --life-ring: var(--brand);
  --life-radius-sm: var(--radius-sm);
  --life-radius-md: var(--radius-md);
  --life-radius-lg: var(--radius-lg);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121212;
    --surface: #1c1c1c;
    --surface-2: #262626;
    --ink: #f2f2f2;
    --ink-2: #a8a8a8;
    --ink-3: #6e6e6e;
    --line: #333333;
    --brand: #d89770;
    --brand-ink: #1f1f1f;
    --brand-soft: #3a2a20;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.05), 0 1px 1px rgba(0, 0, 0, 0.03);
    --shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.4);
  }
}

    </style>

</head>
<body class="min-h-screen font-sans antialiased">
    <div class="app-frame">
      <header class="w-full h-14 flex items-center justify-between px-4 border-b border-[var(--line)] bg-[var(--surface)] shrink-0">
        <h1 class="text-lg font-semibold text-[var(--ink)]">碎碎念</h1>
        <div class="flex items-center gap-1">
          <a href="create.html" data-dom-id="btn-create" class="w-9 h-9 flex items-center justify-center rounded-full text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
            <i data-lucide="plus" class="w-5 h-5"></i>
          </a>
          <button data-dom-id="btn-filter-toggle" class="w-9 h-9 flex items-center justify-center rounded-full text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
            <i data-lucide="calendar" class="w-5 h-5"></i>
          </button>
        </div>
      </header>
      <main id="main-scroll">
        <aside id="date-filter-panel" class="py-3 px-2 border-r border-[var(--line)] bg-[var(--surface)]">
          <div class="flex flex-col gap-2">
            <button data-dom-id="date-2026-08-14" class="w-full flex flex-col items-center py-3 px-1 rounded-lg bg-[var(--brand-soft)] text-[var(--brand)]">
              <span class="text-[11px] opacity-80 leading-none">今天</span>
              <span class="text-sm font-medium mt-1">8月14日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--brand)] mt-1.5"></span>
            </button>
            <button class="w-full flex flex-col items-center py-3 px-1 rounded-lg text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
              <span class="text-sm font-medium">8月13日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--ink-3)] mt-1.5"></span>
            </button>
            <button class="w-full flex flex-col items-center py-3 px-1 rounded-lg text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
              <span class="text-sm font-medium">8月12日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--ink-3)] mt-1.5"></span>
            </button>
            <button class="w-full flex flex-col items-center py-3 px-1 rounded-lg text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
              <span class="text-sm font-medium">8月10日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--ink-3)] mt-1.5"></span>
            </button>
            <button class="w-full flex flex-col items-center py-3 px-1 rounded-lg text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
              <span class="text-sm font-medium">8月8日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--ink-3)] mt-1.5"></span>
            </button>
            <button class="w-full flex flex-col items-center py-3 px-1 rounded-lg text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
              <span class="text-sm font-medium">8月5日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--ink-3)] mt-1.5"></span>
            </button>
            <button class="w-full flex flex-col items-center py-3 px-1 rounded-lg text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
              <span class="text-sm font-medium">8月1日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--ink-3)] mt-1.5"></span>
            </button>
            <button class="w-full flex flex-col items-center py-3 px-1 rounded-lg text-[var(--ink-2)] hover:bg-[var(--surface-2)] transition-colors">
              <span class="text-sm font-medium">7月28日</span>
              <span class="w-1.5 h-1.5 rounded-full bg-[var(--ink-3)] mt-1.5"></span>
            </button>
          </div>

        <section id="timeline-feed" class="flex flex-col gap-6"></section>
      </main>
    </div>
    <nav data-mobile-nav="global" class="w-full border-t border-[var(--line)] bg-[var(--surface)] h-[64px]"><div class="w-full max-w-md mx-auto grid grid-cols-3 h-full"><a href="home.html" data-nav-key="home" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--brand)] font-medium"><i data-lucide="book-open" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">记录</span></a><a href="create.html" data-nav-key="create" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--ink-2)]"><i data-lucide="plus-circle" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">发布</span></a><a href="me.html" data-nav-key="me" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-[var(--ink-2)]"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a></div></nav>
    <style id="critical-layout">
      body { background: var(--bg); }
      .app-frame { max-width: 28rem; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); }
      #main-scroll { flex: 1; display: flex; overflow: hidden; }
      #date-filter-panel { width: 84px; flex-shrink: 0; overflow-y: auto; }
      #timeline-feed { flex: 1; overflow-y: auto; min-width: 0; padding: 16px; }
      .image-grid-9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
      .image-grid-9 img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--radius-md); }
    </style>
    <script>
      function pad(n) { return String(n).padStart(2, '0'); }
      function fmtTime(iso) {
        const d = new Date(iso);
        return pad(d.getHours()) + ':' + pad(d.getMinutes());
      }
      const WEEKDAYS = ['周日','周一','周二','周三','周四','周五','周六'];
      function fmtDay(iso) {
        const d = new Date(iso);
        return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEKDAYS[d.getDay()];
      }

      async function loadPosts() {
        const feed = document.getElementById('timeline-feed');
        feed.innerHTML = '<p class="text-[var(--ink-2)] text-sm py-10 text-center">加载中…</p>';
        try {
          const res = await fetch('/api/posts', { headers: { 'Accept': 'application/json' } });
          if (res.status === 401) { window.location.href = '/login.html'; return; }
          const data = await res.json();
          renderPosts(data.posts || []);
        } catch (e) {
          feed.innerHTML = '<p class="text-[var(--state-error)] text-sm py-10 text-center">加载失败，请刷新重试</p>';
        }
      }

      function emptyState() {
        const feed = document.getElementById('timeline-feed');
        feed.innerHTML = '<div class="py-16 text-center text-[var(--ink-3)] text-sm">还没有记录，点下方「发布」写第一条吧</div>';
      }

      function renderPosts(posts) {
        const feed = document.getElementById('timeline-feed');
        feed.innerHTML = '';
        if (!posts.length) { emptyState(); return; }
        const groups = [];
        for (const p of posts) {
          const key = new Date(p.created_at).toDateString();
          const last = groups[groups.length - 1];
          if (last && last.key === key) last.items.push(p);
          else groups.push({ key, items: [p] });
        }
        for (const g of groups) {
          const article = document.createElement('article');
          article.className = 'day-section';
          const h2 = document.createElement('h2');
          h2.className = 'text-base font-semibold text-[var(--ink)] mb-3 sticky top-0 bg-[var(--bg)] py-1 z-10';
          h2.textContent = fmtDay(g.items[0].created_at);
          article.appendChild(h2);
          const list = document.createElement('div');
          list.className = 'flex flex-col gap-4';
          for (const p of g.items) list.appendChild(buildEntry(p));
          article.appendChild(list);
          feed.appendChild(article);
        }
        if (window.lucide) lucide.createIcons();
      }

      function buildEntry(p) {
        const entry = document.createElement('div');
        entry.className = 'entry flex gap-3';

        const time = document.createElement('div');
        time.className = 'w-10 text-right text-xs text-[var(--ink-2)] pt-2 shrink-0';
        time.textContent = fmtTime(p.created_at);

        const card = document.createElement('div');
        card.className = 'flex-1 min-w-0 bg-[var(--surface)] rounded-lg p-3 border border-[var(--line)] shadow-sm';

        const text = document.createElement('p');
        text.className = 'text-sm text-[var(--ink)] mb-2 whitespace-pre-wrap break-words';
        text.textContent = p.content;
        card.appendChild(text);

        const actions = document.createElement('div');
        actions.className = 'flex items-center justify-end';
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'flex items-center gap-1 text-xs text-[var(--ink-2)] hover:text-[var(--state-error)] transition-colors';
        del.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i><span>删除</span>';
        del.addEventListener('click', () => deletePost(p.id, entry));
        actions.appendChild(del);
        card.appendChild(actions);

        entry.appendChild(time);
        entry.appendChild(card);
        return entry;
      }

      async function deletePost(id, entryEl) {
        if (!confirm('确定删除这条动态吗？')) return;
        try {
          const res = await fetch('/api/posts/' + id, { method: 'DELETE' });
          const data = await res.json();
          if (res.ok) {
            const article = entryEl.closest('.day-section');
            entryEl.remove();
            if (article && article.querySelectorAll('.entry').length === 0) article.remove();
            const feed = document.getElementById('timeline-feed');
            if (!feed.querySelector('.entry')) emptyState();
          } else {
            alert(data.error || '删除失败');
          }
        } catch (e) {
          alert('网络错误，请稍后重试');
        }
      }

      loadPosts();
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
